<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="white"/>
<text x="56" y="64" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#082B62" text-anchor="start">05. Checkpoint Verification Mechanism</text><text x="56" y="100" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526681" text-anchor="start">No single signal is trusted by itself</text><line x1="56" y1="122" x2="1544" y2="122" stroke="#CAD7EA" stroke-width="2"/><rect x="55" y="160" width="470" height="590" rx="12" fill="white" stroke="#CAD7EA" stroke-width="2"/><rect x="55" y="160" width="470" height="72" rx="12" fill="#0F9D78" stroke="#0F9D78" stroke-width="2"/><text x="290" y="205" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">1. Active Checkpoint</text><circle cx="100" cy="285" r="8" fill="#0F9D78" stroke="#0F9D78" stroke-width="2"/><text x="125" y="293" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">App check-in</text><circle cx="100" cy="350" r="8" fill="#0F9D78" stroke="#0F9D78" stroke-width="2"/><text x="125" y="358" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">Selfie / photo</text><circle cx="100" cy="415" r="8" fill="#0F9D78" stroke="#0F9D78" stroke-width="2"/><text x="125" y="423" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">QR / NFC</text><circle cx="100" cy="480" r="8" fill="#0F9D78" stroke="#0F9D78" stroke-width="2"/><text x="125" y="488" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">Seal scan</text><circle cx="100" cy="545" r="8" fill="#0F9D78" stroke="#0F9D78" stroke-width="2"/><text x="125" y="553" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">Signature / PIN</text><text x="542" y="465" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#082B62" text-anchor="middle">+</text><rect x="560" y="160" width="470" height="590" rx="12" fill="white" stroke="#CAD7EA" stroke-width="2"/><rect x="560" y="160" width="470" height="72" rx="12" fill="#0B4AA2" stroke="#0B4AA2" stroke-width="2"/><text x="795" y="205" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">2. Passive Checkpoint</text><circle cx="605" cy="285" r="8" fill="#0B4AA2" stroke="#0B4AA2" stroke-width="2"/><text x="630" y="293" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">Telematics / ELD</text><circle cx="605" cy="350" r="8" fill="#0B4AA2" stroke="#0B4AA2" stroke-width="2"/><text x="630" y="358" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">Trailer GPS</text><circle cx="605" cy="415" r="8" fill="#0B4AA2" stroke="#0B4AA2" stroke-width="2"/><text x="630" y="423" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">LPR / camera</text><circle cx="605" cy="480" r="8" fill="#0B4AA2" stroke="#0B4AA2" stroke-width="2"/><text x="630" y="488" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">GenLogs sighting</text><circle cx="605" cy="545" r="8" fill="#0B4AA2" stroke="#0B4AA2" stroke-width="2"/><text x="630" y="553" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">RFID / smart seal</text><circle cx="605" cy="610" r="8" fill="#0B4AA2" stroke="#0B4AA2" stroke-width="2"/><text x="630" y="618" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">Toll / gate data</text><text x="1047" y="465" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#082B62" text-anchor="middle">+</text><rect x="1065" y="160" width="470" height="590" rx="12" fill="white" stroke="#CAD7EA" stroke-width="2"/><rect x="1065" y="160" width="470" height="72" rx="12" fill="#6D4AFF" stroke="#6D4AFF" stroke-width="2"/><text x="1300" y="205" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">3. Corroborated Checkpoint</text><circle cx="1110" cy="285" r="8" fill="#6D4AFF" stroke="#6D4AFF" stroke-width="2"/><text x="1135" y="293" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">Driver app GPS</text><circle cx="1110" cy="350" r="8" fill="#6D4AFF" stroke="#6D4AFF" stroke-width="2"/><text x="1135" y="358" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">Tractor telematics</text><circle cx="1110" cy="415" r="8" fill="#6D4AFF" stroke="#6D4AFF" stroke-width="2"/><text x="1135" y="423" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">Trailer GPS</text><circle cx="1110" cy="480" r="8" fill="#6D4AFF" stroke="#6D4AFF" stroke-width="2"/><text x="1135" y="488" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">GenLogs sighting</text><circle cx="1110" cy="545" r="8" fill="#6D4AFF" stroke="#6D4AFF" stroke-width="2"/><text x="1135" y="553" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#122A50" text-anchor="start">LPR camera</text><circle cx="800" cy="825" r="36" fill="#082B62" stroke="#082B62" stroke-width="2"/><text x="800" y="834" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="white" text-anchor="middle">✓</text><text x="855" y="835" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#082B62" text-anchor="start">Verified Checkpoint</text>
</svg>