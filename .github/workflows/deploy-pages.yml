name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      # Passing a `version` input here too makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native deps
        run: pnpm rebuild @tailwindcss/oxide esbuild

      - name: Build site
        env:
          DEPLOY_BASE: /item-ai-strategy/
          NODE_ENV: production
        run: pnpm exec vite build

      - name: Prepare static artifact
        run: |
          rm -f dist/public/.gitkeep
          rm -rf dist/public/__manus__
          sed -i 's|<script defer src="%VITE_ANALYTICS_ENDPOINT%/umami"[^>]*></script>||' dist/public/index.html
          cp dist/public/index.html dist/public/404.html
          touch dist/public/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
